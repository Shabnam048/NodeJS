<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
 
</head>
<body>
<div class="form-box">
    <h1>Register Here</h1>
    <form>

        <label for="fname">First name:</label><br>
        <input type="text" id="fname" name="fname" value=" "><br>

        <label for="fname">Middle name:</label><br>
        <input type="text" id="mname" name="mname" value=" "><br>

        <label for="lname">Last name:</label><br>
        <input type="text" id="lname" name="lname" value=" "><br>
        <label for="adress">Address:</label><br>
        <textarea id="adress" name="adress" rows="5" cols="40" placeholder="Enter your address"></textarea><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" title="Password should be atleast eight chatecters long."> <br>

        <label for="email">E-Mail:</label><br>
        <input type="text" id="email" name="email" placeholder="example@gmail.com"><br>

        <label for="country">Country:</label><br>
        <select id="country" name="country">
            <option value="">---Select Country----</option>
            <option value="India">India</option>
            <option value="Japan">Japan</option>
            <option value="China">China</option>
            <option value="Korea">Korea</option>
        </select> <br>

        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label><br><br>

        <button>Reset</button> <br><br>

        <button>Submit</button> <br><br>
        
    </form>
</div>
</body>
</html>
